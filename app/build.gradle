plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
}

android {
    namespace 'com.whisperkeyboard'
    compileSdk 34
    ndkVersion "28.2.13676358"

    defaultConfig {
        applicationId "com.whisperkeyboard"
        minSdk 26
        targetSdk 34
        versionCode 70
        versionName "2.7.10"

        ndk {
            // arm64-only is intentional: 32-bit/x86 builds would bloat the
            // whisper.cpp native compile and are unsuitable for large models.
            // x86_64 emulators are therefore unsupported; test on arm64 hardware.
            abiFilters 'arm64-v8a'
        }

        externalNativeBuild {
            cmake {
                cppFlags '-std=c++17'
                arguments '-DANDROID_STL=c++_shared',
                          '-DANDROID_PLATFORM=android-26',
                          '-DCMAKE_BUILD_TYPE=Release'
            }
        }
    }

    def signingFile = rootProject.file("../gradle-signing.properties")
    def signingProps = new Properties()

    if (signingFile.exists()) {
        signingFile.withInputStream {
            signingProps.load(it)
        }
    }

    def requiredSigningKeys = [
        "whisper.storeFile",
        "whisper.storePassword",
        "whisper.keyAlias",
        "whisper.keyPassword"
    ]

    def missingSigningKeys = requiredSigningKeys.findAll {
        !signingProps.getProperty(it)
    }

    def buildingRelease = gradle.startParameter.taskNames.any {
        it.toLowerCase(java.util.Locale.ROOT).contains("release")
    }

    signingConfigs {
        release {
            if (missingSigningKeys.isEmpty()) {
                storeFile rootProject.file(
                    signingProps.getProperty("whisper.storeFile")
                )
                storePassword signingProps.getProperty(
                    "whisper.storePassword"
                )
                keyAlias signingProps.getProperty(
                    "whisper.keyAlias"
                )
                keyPassword signingProps.getProperty(
                    "whisper.keyPassword"
                )
            }
        }
    }

    buildTypes {
        debug {
            applicationIdSuffix ".debug"
            versionNameSuffix "-debug"
            debuggable true
        }

        release {
            if (!missingSigningKeys.isEmpty() && buildingRelease) {
                throw new GradleException(
                    "Release signing configuration missing: " +
                        missingSigningKeys.join(", ")
                )
            }

            minifyEnabled true
            shrinkResources true

            proguardFiles(
                getDefaultProguardFile(
                    "proguard-android-optimize.txt"
                ),
                "proguard-rules.pro"
            )

            signingConfig signingConfigs.release
            debuggable false
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    kotlinOptions {
        jvmTarget = '17'
    }

    buildFeatures {
        viewBinding true
    }

    externalNativeBuild {
        cmake {
            path file('src/main/cpp/CMakeLists.txt')
            version '3.22.1'
        }
    }

    packaging {
        jniLibs {
            useLegacyPackaging true
        }
    }

    lint {
        abortOnError true
        checkReleaseBuilds true
        warningsAsErrors false
    }
}

dependencies {
    implementation 'androidx.core:core-ktx:1.12.0'
    implementation 'androidx.appcompat:appcompat:1.6.1'
    implementation 'com.google.android.material:material:1.11.0'
    implementation 'androidx.lifecycle:lifecycle-service:2.7.0'
    implementation 'androidx.lifecycle:lifecycle-runtime-ktx:2.7.0'
    implementation 'org.jetbrains.kotlinx:kotlinx-coroutines-android:1.7.3'
    // Moonshine v2 - on-device streaming STT, English (includes ONNX Runtime, no NDK needed)
    implementation 'ai.moonshine:moonshine-voice:0.1.5'
}
